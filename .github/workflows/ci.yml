name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify CI configuration
        run: npm run test:ci-config

      - name: Check static landing (no third-party requests, no inline code)
        run: npm run test:landing

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://asepsico:asepsico@localhost:5432/asepsico?schema=public

      - name: Typecheck
        run: npm run typecheck

      - name: Security and integration tests
        run: npm --workspace @asepsico/api run test:security

      # Pruebas unitarias de la web (apps/web/test: entorno demo, usuario de /auth/me, conceptos
      # de factura). Sin red ni BD.
      - name: Web unit tests
        run: npm --workspace @asepsico/web run test -- --ci

      # Condición de Argos: el build de la landing debe fallar cerrado sin LEGAL_TITULAR_NIF ni
      # LEGAL_TITULAR_DOMICILIO (si no, Render publicaría [[NIF]] en el aviso legal). Se ejecuta
      # sin esas variables y con salida en un directorio temporal; se exige código distinto de 0 y
      # que no quede ningún HTML publicable. build.mjs llega con feat/landing-v2: hasta que esté en
      # la rama, el paso se omite con un aviso visible.
      # TODO: cuando feat/landing-v2 esté en main, quitar la condición para que su ausencia falle.
      - name: Landing build fails closed without legal holder variables
        shell: bash
        run: |
          if [ ! -f apps/landing/build.mjs ]; then
            echo "::notice title=build.mjs pendiente::apps/landing/build.mjs aún no está en esta rama (llega con feat/landing-v2). Paso omitido."
            exit 0
          fi
          out="$RUNNER_TEMP/landing-dist-sin-variables"
          rm -rf "$out"
          set +e
          env -u LEGAL_TITULAR_NIF -u LEGAL_TITULAR_DOMICILIO node apps/landing/build.mjs --out "$out"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error title=La landing se construye sin datos del titular::node build.mjs terminó con 0 sin LEGAL_TITULAR_NIF ni LEGAL_TITULAR_DOMICILIO."
            exit 1
          fi
          if [ -d "$out" ] && find "$out" -name '*.html' | grep -q .; then
            echo "::error title=La landing deja HTML publicable::build.mjs falló pero dejó HTML en la salida."
            exit 1
          fi
          echo "OK: build.mjs falla cerrado sin variables (código $status) y no deja HTML."

      - name: Build
        run: npm run build

      # Condición de Argos (revisión C4, A1): la web sale como export estático, sin rewrites ni
      # API_INTERNAL_URL (el proxy /api/v1 de la etapa Vercel no puede volver). Sin red ni BD.
      - name: Web build is a static export without API proxy
        run: node scripts/check-web-static-export.mjs

  postgres-integration:
    name: PostgreSQL migrations and real HTTP smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asepsico
          POSTGRES_PASSWORD: asepsico
          POSTGRES_DB: asepsico
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U asepsico -d asepsico"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      DATABASE_URL: postgresql://asepsico:asepsico@localhost:5432/asepsico?schema=public
      JWT_SECRET: ci-staff-jwt-secret-with-more-than-32-characters
      PORTAL_JWT_SECRET: ci-portal-jwt-secret-different-and-over-32-chars
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: test
      ASEPSICO_API_URL: http://127.0.0.1:4000/api/v1
      ASEPSICO_SMOKE_EMAIL: demo@asepsico.es
      # La contraseña de la cuenta demo NO se fija aquí: el paso "Generate disposable seed
      # password" crea una aleatoria por ejecución (repo público; hallazgo de Argos).
      # BD desechable recién sembrada: el smoke activa MFA temporalmente en la cuenta demo
      # (la API lo exige a OWNER/ADMIN/THERAPIST) y lo desactiva al terminar.
      ASEPSICO_SMOKE_ENROLL_MFA: '1'
      # La API de CI solo recibe tráfico local: confiar en loopback permite que los scripts
      # simulen IPs de cliente distintas con X-Forwarded-For sin arrancar en NODE_ENV=production
      # (que activaría cookies "secure" sobre HTTP). El smoke no envía la cabecera, así que para
      # él req.ip sigue siendo 127.0.0.1. Producción usa TRUST_PROXY=1 (ops/PILOT_RUNBOOK.md).
      TRUST_PROXY: loopback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U asepsico -d asepsico; then
              exit 0
            fi
            echo "PostgreSQL todavía no está listo (intento ${attempt}/30)"
            sleep 2
          done
          echo "PostgreSQL no llegó a estar disponible" >&2
          exit 1

      - name: Generate Prisma Client (db:generate)
        run: npm run db:generate

      - name: Apply migrations to real PostgreSQL (db:migrate)
        run: npm run db:migrate:ci

      # Detecta drift entre lo que dejan las migraciones y lo que declara schema.prisma.
      # `migrate deploy` solo comprueba que las migraciones se aplican, no que el resultado
      # coincida con el schema: así sobrevivió el índice único PatientPortalAccount_patientId_key.
      # Como la BD del job está recién migrada desde cero, comparar BD vs schema equivale a
      # comparar migraciones vs schema (sin necesidad de shadow database).
      # Códigos de `migrate diff --exit-code`: 0 = sin diferencias, 2 = hay drift, 1 = error.
      - name: Check migrations match schema.prisma (prisma migrate diff)
        working-directory: apps/api
        shell: bash
        run: |
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code --script > "$RUNNER_TEMP/schema-drift.sql"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "OK: las migraciones producen exactamente el esquema de schema.prisma."
            exit 0
          fi
          if [ "$status" -eq 2 ]; then
            echo "::error title=Drift entre migraciones y schema.prisma::La BD migrada no coincide con schema.prisma. Crea una migración nueva (nunca edites una ya aplicada). SQL necesario para igualarlas:"
            cat "$RUNNER_TEMP/schema-drift.sql"
            exit 1
          fi
          echo "::error title=prisma migrate diff falló::Error ejecutando prisma migrate diff (código $status)."
          cat "$RUNNER_TEMP/schema-drift.sql"
          exit 1

      # Contraseña de la cuenta demo de la BD desechable: aleatoria en cada ejecución, enmascarada en
      # los logs y compartida por el seed (SEED_DEMO_PASSWORD) y los scripts (ASEPSICO_SMOKE_PASSWORD).
      - name: Generate disposable seed password
        shell: bash
        run: |
          pass="$(openssl rand -base64 30 | tr -d '\n/+=')"
          [ ${#pass} -ge 24 ] || exit 1
          echo "::add-mask::$pass"
          echo "SEED_DEMO_PASSWORD=$pass" >> "$GITHUB_ENV"
          echo "ASEPSICO_SMOKE_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Seed smoke-test account
        run: npm run db:seed

      # setsid: la API arranca en su propio grupo de procesos (PGID = el PID guardado). `npm run start`
      # cuelga de `sh -c nest start` → nest → node dist/main, y en Ubuntu /bin/sh (dash) no reenvía
      # SIGTERM: matar solo el PID de npm dejaba viva la API vieja en :4000. Se para con kill -- -PGID.
      - name: Start API
        shell: bash
        run: |
          setsid npm --workspace @asepsico/api run start > "$RUNNER_TEMP/asepsico-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/asepsico-api.pid"

      - name: Wait for API health endpoint
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:4000/api/v1/health > "$RUNNER_TEMP/health.json"; then
              cat "$RUNNER_TEMP/health.json"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/asepsico-api.pid")" 2>/dev/null; then
              echo "La API terminó antes de estar saludable" >&2
              cat "$RUNNER_TEMP/asepsico-api.log" >&2
              exit 1
            fi
            echo "API todavía no disponible (intento ${attempt}/60)"
            sleep 2
          done
          echo "La API no respondió a tiempo" >&2
          cat "$RUNNER_TEMP/asepsico-api.log" >&2
          exit 1

      - name: Run real HTTP smoke test
        run: npm run test:smoke

      # Lista de espera pública: alta cifrada, deduplicación (también simultánea), Origin, tipo
      # de contenido, envío demasiado rápido y rate limit por IP. Usa IPs 203.0.113.x vía
      # X-Forwarded-For (TRUST_PROXY=loopback) y borra las filas que crea. Tarda ~5 s.
      - name: Verify public waitlist (real PostgreSQL)
        run: node scripts/verify-waitlist.mjs

      # Registro cerrado por invitación (hallazgo de Argos): ráfaga de registros con el mismo token
      # → un solo 201 y sin usuarios ni workspaces huérfanos; el THERAPIST invitado recibe 403 de
      # MFA antes de tocar datos clínicos. Usa X-Forwarded-For (TRUST_PROXY=loopback).
      - name: Verify invitation-only registration under concurrency (real PostgreSQL)
        run: node scripts/verify-registration-invite-live.mjs

      # Recepción (ASSISTANT) anula un cobro y revierte un pago por HTTP (condición de Argos, S3):
      # las respuestas no le devuelven el motivo, otra consulta recibe 404 sin dejar rastro y el export
      # del workspace del OWNER contiene INVOICE_VOIDED y PAYMENT_REVERSED con el ASSISTANT como actor
      # y metadatos {invoiceId, reasonProvided} sin el texto del motivo. Crea sus propias consultas
      # ficticias (no toca la cuenta demo) y usa IPs 198.51.100.x vía X-Forwarded-For.
      - name: Verify assistant voids and reversals are audited in the workspace export (real PostgreSQL)
        run: node scripts/verify-billing-assistant-live.mjs

      # Condiciones nuevas para una cuenta que YA existe (condición de Argos, commit 37b9b78): la BD
      # se sembró sin LEGAL_TITULAR_*; se reinicia la API CON un NIF y un domicilio FICTICIOS
      # válidos, el texto servido cambia de hash y la cuenta demo debe recibir 428
      # TERMS_ACCEPTANCE_REQUIRED, aceptar y dejar de recibirlo. Nunca datos reales: 12345678Z es
      # el DNI de ejemplo con letra de control válida. Va antes del paso de MFA (que deja la cuenta
      # demo en espera ~1 min) y deja la API en marcha para los pasos siguientes.
      - name: Restart API with fictitious legal holder data (new terms version)
        shell: bash
        env:
          LEGAL_TITULAR_NIF: 12345678Z
          LEGAL_TITULAR_DOMICILIO: Calle Ficticia 1, 00000 Ciudad Inventada
        run: |
          # Todo el grupo (npm, sh, nest y node dist/main), no solo npm: si no, la API vieja (sin
          # LEGAL_TITULAR_*) sigue respondiendo en :4000 y el smoke del 428 recibe 200.
          kill -- "-$(cat "$RUNNER_TEMP/asepsico-api.pid")" 2>/dev/null || true
          stopped=0
          for attempt in {1..30}; do
            if ! curl --silent --output /dev/null http://127.0.0.1:4000/api/v1/health; then
              stopped=1
              break
            fi
            sleep 1
          done
          if [ "$stopped" -ne 1 ]; then
            echo "La API anterior sigue respondiendo en :4000: no se puede reiniciar con las condiciones nuevas" >&2
            exit 1
          fi
          setsid npm --workspace @asepsico/api run start >> "$RUNNER_TEMP/asepsico-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/asepsico-api.pid"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:4000/api/v1/health > "$RUNNER_TEMP/health.json"; then
              cat "$RUNNER_TEMP/health.json"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/asepsico-api.pid")" 2>/dev/null; then
              echo "La API terminó antes de estar saludable" >&2
              cat "$RUNNER_TEMP/asepsico-api.log" >&2
              exit 1
            fi
            echo "API todavía no disponible (intento ${attempt}/60)"
            sleep 2
          done
          echo "La API no respondió a tiempo" >&2
          cat "$RUNNER_TEMP/asepsico-api.log" >&2
          exit 1

      - name: Real HTTP smoke test with new terms (428 → accept → no 428)
        run: npm run test:smoke
        env:
          ASEPSICO_SMOKE_EXPECT_TERMS_428: '1'

      # Ráfaga simultánea de login/mfa contra el límite por cuenta (hallazgo de Argos).
      # scripts/verify-mfa-concurrency.mjs llega con la PR #9 (rama fix/mfa-hardening); hasta
      # que esté en main el paso se omite con un aviso visible en lugar de fallar. Cuando la PR
      # se fusione, se ejecuta solo, sin tocar este workflow. Va después del smoke porque deja
      # la cuenta demo en espera ~1 min y la restaura (sin MFA) al terminar.
      # TODO: cuando el script esté en main, quitar la condición para que su ausencia falle el job.
      - name: Verify MFA attempt limit under concurrency (real PostgreSQL)
        shell: bash
        run: |
          if [ ! -f scripts/verify-mfa-concurrency.mjs ]; then
            echo "::notice title=verify-mfa-concurrency pendiente::scripts/verify-mfa-concurrency.mjs aún no está en esta rama (llega con la PR #9). Paso omitido."
            exit 0
          fi
          node scripts/verify-mfa-concurrency.mjs

      # Verificaciones "en vivo" del sprint 4 contra la API y la BD de este job (datos ficticios; cada
      # script crea sus propios workspaces y usuarios y no toca la cuenta demo). Salen con código
      # distinto de 0 si algo no cuadra, y timeout-minutes acota cada una para no alargar el CI.
      # Acceso excepcional: QA_CONCURRENCY_ROUNDS=3 (por defecto 10) es el modo rápido de CI; la
      # carrera sigue cubierta por rondas y por session-close-race. El script espera al siguiente
      # paso TOTP de 30 s por usuario, de ahí el margen del timeout.
      - name: Verify exceptional access end to end (real API and PostgreSQL)
        timeout-minutes: 4
        run: node scripts/verify-exceptional-access-live.mjs
        env:
          QA_CONCURRENCY_ROUNDS: '3'

      # Reserva de citas del portal. Las condiciones que aceptan sus cuentas se piden a la API en
      # marcha (GET /legal/terms): desde el reinicio de arriba su hash incluye LEGAL_TITULAR_*, que
      # este paso no tiene; calcularlas en el proceso del script daba un hash viejo y 428 en POST /patients.
      - name: Verify portal appointment booking end to end (real API and PostgreSQL)
        timeout-minutes: 3
        run: node scripts/verify-reserva-citas-live.mjs

      # Carrera crear cita vs. cerrar proceso con bloqueos de fila reales (no la API: instancia los
      # servicios contra la BD del servicio postgres). Crea su propio workspace ficticio y no toca
      # la cuenta demo. RACE_DATABASE_REQUIRED=1 hace que falle, en vez de omitirse, si falta la URL.
      # Incluye la doble reserva del portal y las altas solapadas de la agenda (advisory locks e
      # índice único del hueco retenido): booking-race.
      - name: Session close and booking race tests (real PostgreSQL)
        run: npm --workspace @asepsico/api run test:security -- --ci --testPathPattern '(session-close-race|booking-race)'
        env:
          RACE_DATABASE_URL: postgresql://asepsico:asepsico@localhost:5432/asepsico?schema=public
          RACE_DATABASE_REQUIRED: '1'

      # Panel privado de la lista de espera (PLATFORM_ADMIN) con la app completa contra la BD del
      # servicio: 404 para no admins, no-store, supresión con contraseña, auditoría sin datos y
      # regresión multi-tenant de los endpoints clínicos. Crea sus propios datos ficticios.
      # waitlist-phone-db: teléfono cifrado en reposo, borrado solo del teléfono (panel y CLI
      # waitlist:set-phone) con auditoría y nada del teléfono en logs ni en PlatformAuditLog.
      # users-set-password-db: CLI users:set-password (tokenVersion, --reset-mfa, solo ACTIVE, auditoría).
      - name: Platform admin waitlist panel tests (real PostgreSQL)
        run: npm --workspace @asepsico/api run test:security -- --ci --testPathPattern '(platform-admin-db|waitlist-phone-db|users-set-password-db)'
        env:
          RACE_DATABASE_URL: postgresql://asepsico:asepsico@localhost:5432/asepsico?schema=public
          RACE_DATABASE_REQUIRED: '1'

      - name: Stop API
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/asepsico-api.pid" ]; then
            kill -- "-$(cat "$RUNNER_TEMP/asepsico-api.pid")" 2>/dev/null || true
          fi

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asepsico-api-ci-logs
          path: |
            ${{ runner.temp }}/asepsico-api.log
            ${{ runner.temp }}/health.json
          if-no-files-found: ignore
          retention-days: 7
